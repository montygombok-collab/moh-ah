<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>آلة حاسبة - محمد احمد</title>
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Cairo:wght@600;800&display=swap');

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Cairo', sans-serif;
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: radial-gradient(circle at center, #1a1a2e 0%, #0f0f1a 100%);
            overflow: hidden;
        }

        /* حاوية الآلة الحاسبة */
        .calculator {
            position: relative;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(15px);
            -webkit-backdrop-filter: blur(15px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 25px;
            padding: 25px;
            width: 340px;
            box-shadow: 0 25px 50px rgba(0, 0, 0, 0.5);
            z-index: 1;
        }

        /* شاشة العرض */
        .display {
            width: 100%;
            height: 85px;
            background: rgba(0, 0, 0, 0.4);
            border: none;
            border-radius: 15px;
            margin-bottom: 20px;
            padding: 15px;
            text-align: left;
            direction: ltr;
            color: #fff;
            font-size: 2.2rem;
            font-weight: bold;
            box-shadow: inset 0 4px 10px rgba(0, 0, 0, 0.5);
            overflow-x: auto;
        }

        /* منطقة الأزرار */
        .buttons-container {
            position: relative;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 12px;
            direction: ltr;
        }

        /* الكلمة المتوهجة في المنتصف */
        .glowing-watermark {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%) rotate(-12deg);
            font-size: 2.1rem;
            font-weight: 800;
            color: #fff;
            pointer-events: none; /* حتى لا تمنع الضغط على الأزرار خلفها */
            z-index: 10;
            white-space: nowrap;
            text-shadow: 
                0 0 7px #fff,
                0 0 15px #00f3ff,
                0 0 30px #00f3ff,
                0 0 60px #00f3ff;
            animation: pulseGlow 2.5s infinite alternate;
        }

        @keyframes pulseGlow {
            0% {
                opacity: 0.85;
                text-shadow: 
                    0 0 5px #fff,
                    0 0 10px #00f3ff,
                    0 0 20px #00f3ff;
            }
            100% {
                opacity: 1;
                text-shadow: 
                    0 0 10px #fff,
                    0 0 25px #00f3ff,
                    0 0 45px #00f3ff,
                    0 0 80px #0066ff;
            }
        }

        /* تنسيق الأزرار */
        button {
            position: relative;
            z-index: 2;
            height: 58px;
            border: none;
            border-radius: 15px;
            background: rgba(255, 255, 255, 0.08);
            color: #ffffff;
            font-size: 1.3rem;
            font-weight: 600;
            cursor: pointer;
            transition: all 0.2s ease;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
        }

        button:hover {
            background: rgba(255, 255, 255, 0.18);
            transform: translateY(-2px);
        }

        button:active {
            transform: scale(0.94);
        }

        /* أزرار العمليات */
        .operator {
            background: rgba(0, 243, 255, 0.15);
            color: #00f3ff;
        }

        .operator:hover {
            background: rgba(0, 243, 255, 0.3);
        }

        /* زر المسح */
        .clear {
            background: rgba(255, 71, 87, 0.2);
            color: #ff4757;
        }

        .clear:hover {
            background: rgba(255, 71, 87, 0.35);
        }

        /* زر يساوي */
        .equal {
            grid-column: span 2;
            background: linear-gradient(135deg, #00f3ff, #0066ff);
            color: #fff;
            box-shadow: 0 0 15px rgba(0, 243, 255, 0.4);
        }

        .equal:hover {
            box-shadow: 0 0 25px rgba(0, 243, 255, 0.7);
        }
    </style>
</head>
<body>

    <div class="calculator">
        <!-- شاشة عرض الأرقام -->
        <input type="text" class="display" id="display" readonly placeholder="0">
        
        <div class="buttons-container">
            <!-- الاسم المتوهج في المنتصف -->
            <div class="glowing-watermark">محمد احمد</div>

            <!-- الأزرار -->
            <button class="clear" onclick="clearDisplay()">C</button>
            <button class="operator" onclick="deleteLast()">⌫</button>
            <button class="operator" onclick="appendValue('%')">%</button>
            <button class="operator" onclick="appendValue('/')">÷</button>

            <button onclick="appendValue('7')">7</button>
            <button onclick="appendValue('8')">8</button>
            <button onclick="appendValue('9')">9</button>
            <button class="operator" onclick="appendValue('*')">×</button>

            <button onclick="appendValue('4')">4</button>
            <button onclick="appendValue('5')">5</button>
            <button onclick="appendValue('6')">6</button>
            <button class="operator" onclick="appendValue('-')">−</button>

            <button onclick="appendValue('1')">1</button>
            <button onclick="appendValue('2')">2</button>
            <button onclick="appendValue('3')">3</button>
            <button class="operator" onclick="appendValue('+')">+</button>

            <button onclick="appendValue('0')">0</button>
            <button onclick="appendValue('.')">.</button>
            <button class="equal" onclick="calculate()">=</button>
        </div>
    </div>

    <script>
        const display = document.getElementById('display');

        // إضافة الرقم أو العملية للشاشة
        function appendValue(val) {
            if (display.value === 'خطأ') display.value = '';
            display.value += val;
        }

        // مسح الشاشة بالكامل
        function clearDisplay() {
            display.value = '';
        }

        // حذف آخر رقم
        function deleteLast() {
            if (display.value === 'خطأ') {
                display.value = '';
            } else {
                display.value = display.value.slice(0, -1);
            }
        }

        // حساب النتيجة
        function calculate() {
            try {
                if (display.value.trim() === '') return;
                // استبدال النسبة المئوية إن وجدت وحساب المعادلة
                let expression = display.value.replace(/%/g, '/100');
                let result = eval(expression);
                
                // تقريب الكسور العشرية الطويلة
                display.value = Number.isInteger(result) ? result : parseFloat(result.toFixed(6));
            } catch (error) {
                display.value = 'خطأ';
            }
        }

        // دعم الكتابة من لوحة المفاتيح (الكيبورد)
        document.addEventListener('keydown', function(event) {
            const key = event.key;
            if ((key >= '0' && key <= '9') || ['+', '-', '*', '/', '.', '%'].includes(key)) {
                appendValue(key);
            } else if (key === 'Enter' || key === '=') {
                event.preventDefault();
                calculate();
            } else if (key === 'Backspace') {
                deleteLast();
            } else if (key === 'Escape') {
                clearDisplay();
            }
        });
    </script>

</body>
</html>
